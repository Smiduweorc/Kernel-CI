# Git hooks, managed by lefthook (https://lefthook.dev).
# Install them with the "setup" task. YAML needs spaces, so no tabs here.
#
# Every hook shells out to scripts/tasks.sh, so the hooks, make and CI run
# exactly the same commands. Booting the VMs takes minutes, so no hook does
# it: CI does, and `make vm` does it locally.

pre-commit:
    parallel: false
    commands:
        fmt:
            run: scripts/tasks.sh fmt {staged_files}
            stage_fixed: true
        lint:
            run: scripts/tasks.sh lint

pre-push:
    commands:
        test:
            run: scripts/tasks.sh test

commit-msg:
    commands:
        conventional:
            run: scripts/commit-msg.sh {1}
